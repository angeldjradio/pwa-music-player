<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Reproductor PWA profesional para radio en directo con estilo moderno."
    />
    <title>Live Pulse Radio</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">LP</div>
          <div>
            <p class="eyebrow">Radio en directo</p>
            <h1>Live Pulse</h1>
          </div>
        </div>
        <button id="installBtn" class="ghost-button hidden" type="button">
          Instalar app
        </button>
      </header>

      <main class="player-card">
        <div class="cover-art" aria-hidden="true">
          <div class="cover-glow"></div>
          <div class="cover-wave wave-one"></div>
          <div class="cover-wave wave-two"></div>
          <div class="cover-wave wave-three"></div>
        </div>

        <div class="player-content">
          <div class="meta-row">
            <span class="live-pill">
              <span class="live-dot"></span>
              En vivo
            </span>
            <span id="networkStatus" class="status-chip">Conectando…</span>
          </div>

          <div class="station-info">
            <p class="station-kicker">Estación</p>
            <h2>Live Pulse FM</h2>
            <p class="station-subtitle">Música, voces y energía constante</p>
          </div>

          <div class="visualizer" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="progress-wrap" aria-label="Indicador de reproducción">
            <div class="progress-track">
              <div id="progressBar" class="progress-bar"></div>
            </div>
          </div>

          <div class="controls">
            <button id="prevBtn" class="icon-button" type="button" aria-label="Anterior">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm12 1.5L9 12l9 4.5z"/></svg>
            </button>

            <button id="playPauseBtn" class="play-button" type="button" aria-label="Reproducir o pausar">
              <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            </button>

            <button id="nextBtn" class="icon-button" type="button" aria-label="Siguiente">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 6.5 15 12l-9 5.5z"/></svg>
            </button>
          </div>

          <div class="volume-row">
            <button id="muteBtn" class="mute-button" type="button" aria-label="Silenciar">
              <svg id="muteIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10zm11 .2 4.5-4.5 1.4 1.4-4.5 4.5 4.5 4.5-1.4 1.4L14 14.8z"/></svg>
            </button>
            <input
              id="volumeSlider"
              class="volume-slider"
              type="range"
              min="0"
              max="100"
              value="80"
              aria-label="Volumen"
            />
          </div>
        </div>
      </main>
    </div>

    <audio id="audioPlayer" preload="auto" crossorigin="anonymous"></audio>

    <script src="./app.js"></script>
  </body>
</html>
